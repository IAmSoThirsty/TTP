apiVersion: v1
kind: Secret
metadata:
  name: ttp-secrets
  namespace: ttp-prod
type: Opaque
stringData:
  # Database (replace with actual values)
  DATABASE_URL: "postgresql://ttp:CHANGE_ME@ttp-prod-db.xxxxx.us-east-1.rds.amazonaws.com:5432/ttp"

  # Redis (replace with actual values)
  REDIS_URL: "redis://ttp-prod-redis.xxxxx.cache.amazonaws.com:6379/0"

  # Security (generate with: openssl rand -hex 32)
  SECRET_KEY: "CHANGE_ME_USE_OPENSSL_RAND_HEX_32"

  # AWS Credentials (replace with actual values)
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"

  # OAuth2 (optional, for production)
  OAUTH2_ISSUER: ""
  OAUTH2_AUDIENCE: ""

  # OpenTelemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
